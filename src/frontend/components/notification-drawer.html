  <div id="notificationDrawer" class="fixed inset-0 bg-white dark:bg-gray-900 z-50 hidden md:hidden flex-col">
    <div class="px-4 py-4 border-b border-gray-200 dark:border-gray-700 flex items-center justify-between bg-white dark:bg-gray-900">
      <button onclick="closeNotificationDrawer()" class="flex items-center gap-2 text-gray-700 dark:text-gray-200 font-medium">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 18l-6-6 6-6"/></svg>
        Back
      </button>
      <h2 class="font-semibold text-gray-900 dark:text-gray-100">Notifications</h2>
      <button onclick="markAllNotificationsRead()" class="text-xs font-semibold text-indigo-600 dark:text-indigo-400">Read all</button>
    </div>
    <div class="grid grid-cols-2 gap-2 p-3 bg-gray-50 dark:bg-gray-950 border-b border-gray-200 dark:border-gray-800">
      <button id="notificationDrawerUnreadTab" onclick="setNotificationFilter('unread')" class="px-3 py-2 rounded-lg text-sm font-black transition">Unread</button>
      <button id="notificationDrawerAllTab" onclick="setNotificationFilter('all')" class="px-3 py-2 rounded-lg text-sm font-black transition">All</button>
    </div>
    <div id="notificationDrawerList" class="flex-1 overflow-y-auto divide-y divide-gray-100 dark:divide-gray-800"></div>
    <button id="notificationDrawerViewAllBtn" onclick="openAllNotifications()" class="w-full px-4 py-3 bg-gray-50 dark:bg-gray-800 text-sm font-semibold text-indigo-600 dark:text-indigo-400 border-t border-gray-200 dark:border-gray-700">View All Notifications</button>
  </div>
