    <div id="myDriveView" class="hidden fade-in space-y-3">
      <div class="enterprise-card overflow-hidden">
        <div class="px-4 py-3 grid grid-cols-1 lg:grid-cols-[15rem_minmax(0,1fr)] gap-3 items-center border-b border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-950">
          <div class="flex items-center gap-3 min-w-0">
            <div class="h-10 w-10 rounded bg-cyan-50 dark:bg-cyan-950/30 border border-cyan-100 dark:border-cyan-900 text-cyan-700 dark:text-cyan-300 grid place-items-center shrink-0">
              <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M10 4l2 2h7a2 2 0 012 2v8.75A3.25 3.25 0 0117.75 20H6.25A3.25 3.25 0 013 16.75V7.25A3.25 3.25 0 016.25 4H10z"/></svg>
            </div>
            <div class="min-w-0">
              <p class="text-xs font-bold uppercase tracking-[0.16em] text-cyan-700 dark:text-cyan-300">Documents</p>
              <h2 class="text-2xl font-black text-gray-950 dark:text-gray-50 leading-tight">My Drive</h2>
              <p id="myDriveSummary" class="hidden"></p>
            </div>
          </div>
          <div class="min-w-0 flex flex-col md:flex-row md:items-center gap-2">
            <div class="relative flex-1 min-w-0">
              <svg class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-5.2-5.2m1.7-4.3a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
              <input id="myDriveSearchInput" oninput="loadMyDrive()" type="search" placeholder="Search in Drive" class="w-full pl-11 pr-4 py-2.5 rounded border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 text-gray-900 dark:text-white focus:ring-2 focus:ring-cyan-600 outline-none">
            </div>
            <div class="flex items-center gap-2 shrink-0">
              <input id="myDriveTypeFilter" type="hidden" value="">
              <button id="myDriveTypeFilterBtn" type="button" onclick="openMyDriveTypeFilterMenu(event)" class="h-10 inline-flex items-center gap-2 rounded border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-900 px-3 text-sm font-bold text-gray-900 dark:text-white hover:bg-gray-50 dark:hover:bg-gray-800" aria-haspopup="menu" aria-expanded="false">
                <span id="myDriveTypeFilterIcon" class="shrink-0"></span>
                <span id="myDriveTypeFilterLabel">All types</span>
                <svg class="h-4 w-4 shrink-0 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m6 9 6 6 6-6"/></svg>
              </button>
              <input id="myDriveModifiedFilter" type="hidden" value="">
              <button id="myDriveModifiedFilterBtn" type="button" onclick="openMyDriveModifiedFilterMenu(event)" class="h-10 inline-flex items-center gap-2 rounded border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-900 px-3 text-sm font-bold text-gray-900 dark:text-white hover:bg-gray-50 dark:hover:bg-gray-800" aria-haspopup="menu" aria-expanded="false">
                <span id="myDriveModifiedFilterIcon" class="shrink-0"></span>
                <span id="myDriveModifiedFilterLabel">Modified</span>
                <svg class="h-4 w-4 shrink-0 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m6 9 6 6 6-6"/></svg>
              </button>
            </div>
          </div>
        </div>
        <div id="myDriveLayoutGrid" class="grid grid-cols-1 lg:grid-cols-[15rem_minmax(0,1fr)] min-h-[32rem] lg:h-[calc(100dvh-10rem)]">
          <aside class="border-b lg:border-b-0 lg:border-r border-gray-200 dark:border-gray-800 bg-gray-50 dark:bg-gray-950 p-3 flex flex-col">
              <button onclick="openMyDriveNewMenu(event)" class="mb-4 inline-flex items-center gap-2 rounded bg-cyan-800 dark:bg-cyan-500 px-4 py-2.5 text-sm font-black text-white dark:text-gray-950 hover:bg-cyan-900 dark:hover:bg-cyan-400 transition">
                <span class="text-xl leading-none">+</span>
                New
              </button>
            <nav class="space-y-1">
              <button id="myDriveMineTab" onclick="setMyDriveTab('mine')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded text-sm font-bold text-left">
                <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V7z"/></svg>
                My Files
              </button>
              <button id="myDriveSharedTab" onclick="setMyDriveTab('shared')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded text-sm font-bold text-left">
                <svg class="w-5 h-5 shrink-0" fill="currentColor" viewBox="0 0 24 24"><path d="M15 8c0-1.42-.5-2.73-1.33-3.76.42-.14.86-.24 1.33-.24 2.21 0 4 1.79 4 4s-1.79 4-4 4c-.43 0-.84-.09-1.23-.21-.03-.01-.06-.02-.1-.03A5.98 5.98 0 0015 8zM16.66 13.13C18.03 14.06 19 15.32 19 17v3h4v-3c0-2.18-3.58-3.47-6.34-3.87zM9 4c2.21 0 4 1.79 4 4s-1.79 4-4 4-4-1.79-4-4 1.79-4 4-4zm0 9c2.67 0 8 1.34 8 4v3H1v-3c0-2.66 5.33-4 8-4z"/></svg>
                Shared with me
              </button>
              <button id="myDriveTrashTab" onclick="setMyDriveTab('trash')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded text-sm font-bold text-left">
                <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6M9 7V4h6v3m-8 0h10"/></svg>
                Trash
              </button>
            </nav>
            <div class="mt-2">
              <div class="px-3">
                <div class="h-2 rounded-full bg-gray-200 dark:bg-gray-800 overflow-hidden"><div id="myDriveUsageBar" class="h-full bg-blue-500 rounded-full" style="width:0%"></div></div>
                <div id="myDriveUsageText" class="mt-2 text-xs text-gray-500 dark:text-gray-400">Storage ready</div>
              </div>
            </div>
            <button type="button" onclick="shareMyDriveApp()" class="mt-auto pt-4 w-full flex items-center gap-3 border-t border-gray-200 dark:border-gray-700 text-left text-cyan-800 dark:text-cyan-200 hover:text-cyan-950 dark:hover:text-cyan-100 transition" aria-label="Share MyDrive Android app">
              <span class="grid h-9 w-9 shrink-0 place-items-center" aria-hidden="true"><svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="7" y="2.5" width="10" height="19" rx="2" stroke-width="2"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 5h4m-3 13.5h2"/></svg></span>
              <span class="min-w-0"><strong class="block text-sm font-black">Get app</strong><small class="block text-[11px] font-semibold opacity-80">MyDrive for Android</small></span>
            </button>
          </aside>
          <main class="min-w-0 min-h-0 bg-white dark:bg-gray-900 flex flex-col overflow-hidden">
            <div class="shrink-0 px-4 py-3 border-b border-gray-200 dark:border-gray-700 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2">
              <div class="flex items-center gap-2 min-w-0">
                <button type="button" onclick="goBackMyDrive()" class="grid h-8 w-8 place-items-center rounded text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-800" title="Back" aria-label="Back">
                  <svg class="h-5 w-5 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
                </button>
                <div id="myDriveBreadcrumbs" class="min-w-0 text-sm text-gray-500 dark:text-gray-400"></div>
              </div>
              <div class="flex items-center gap-2 shrink-0">
                <div class="inline-flex h-8 overflow-hidden rounded border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-900" role="radiogroup" aria-label="View layout">
                  <button id="myDriveListModeBtn" type="button" onclick="setMyDriveMode('list')" class="h-8 w-[55px]" role="radio" aria-label="List layout" title="List layout"></button>
                  <button id="myDriveGridModeBtn" type="button" onclick="setMyDriveMode('grid')" class="h-8 w-[55px]" role="radio" aria-label="Grid layout" title="Grid layout"></button>
                </div>
                <button id="myDriveDetailsToggleBtn" type="button" onclick="toggleMyDriveDetailsPanel()" class="grid h-8 w-8 place-items-center rounded text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-800" title="View details" aria-label="View details" aria-pressed="false">
                  <svg class="h-5 w-5 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10.75v5.5M12 7.75h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                </button>
              </div>
            </div>
            <div id="myDriveContent" class="p-4 min-h-0 flex-1 overflow-y-auto"></div>
          </main>
          <aside id="myDriveDetailsPanel" class="hidden border-t lg:border-t-0 lg:border-l border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900 min-w-0 overflow-hidden">
            <div class="h-full p-4">
              <div class="flex items-center justify-between gap-3 mb-4">
                <div>
                  <h3 class="text-base font-semibold text-gray-950 dark:text-gray-50">Details</h3>
                  <p id="myDriveDetailsSubtitle" class="text-xs text-gray-500 dark:text-gray-400">Select an item to see more.</p>
                </div>
                <button type="button" onclick="toggleMyDriveDetailsPanel(false)" class="grid h-8 w-8 place-items-center rounded text-gray-500 hover:bg-gray-100 dark:hover:bg-gray-800" aria-label="Close details">&times;</button>
              </div>
              <div id="myDriveDetailsBody" class="space-y-3 text-sm"></div>
            </div>
          </aside>
        </div>
      </div>
    </div>
