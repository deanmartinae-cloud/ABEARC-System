  <div id="changelogFeedbackModal" class="fixed inset-0 bg-black/40 hidden z-[60] flex items-end sm:items-center justify-center p-4 backdrop-blur-sm transition-all duration-200">
    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl w-full sm:max-w-lg max-h-[92vh] overflow-y-auto overflow-hidden fade-in" onclick="event.stopPropagation()">
      <div class="p-5 border-b border-gray-100 dark:border-gray-700 flex justify-between items-center bg-gray-50 dark:bg-gray-900 sticky top-0 z-10">
        <div>
          <h3 class="text-lg font-bold text-gray-900 dark:text-gray-100">Submit Bug / Change / Improvement</h3>
          <p class="text-sm text-gray-600 dark:text-gray-400 mt-1">Send feedback to the System / Maintenance team.</p>
        </div>
        <button type="button" onclick="closeModal('changelogFeedbackModal')" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 text-2xl leading-none p-2">&times;</button>
      </div>
      <form id="changelogFeedbackForm" class="p-5 space-y-4">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <label class="block">
            <span class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-1.5">Type</span>
            <select id="changelogFeedbackType" required class="w-full border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white rounded-lg px-3 py-2.5">
              <option value="bug">Bug</option>
              <option value="change_request">Change Request</option>
              <option value="improvement">Improvement</option>
            </select>
          </label>
          <label class="block">
            <span class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-1.5">Priority / Urgency</span>
            <select id="changelogFeedbackPriority" class="w-full border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white rounded-lg px-3 py-2.5">
              <option value="normal">Normal</option>
              <option value="low">Low</option>
              <option value="high">High</option>
              <option value="urgent">Urgent</option>
            </select>
          </label>
        </div>
        <label class="block">
          <span class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-1.5">Title / Summary <span class="text-red-500">*</span></span>
          <input id="changelogFeedbackTitle" required maxlength="180" class="w-full border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white rounded-lg px-3 py-2.5" placeholder="Briefly describe the issue or request">
        </label>
        <label class="block">
          <span class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-1.5">Details <span class="text-red-500">*</span></span>
          <textarea id="changelogFeedbackDetails" required rows="6" maxlength="5000" class="w-full border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white rounded-lg px-3 py-2.5" placeholder="What happened, what should change, or how could the system improve?"></textarea>
        </label>
        <div>
          <span class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-1.5">Attachment</span>
          <div id="changelogFeedbackDropZone" role="button" tabindex="0" aria-label="Drag and drop attachment here, or click to browse" class="group rounded-xl border-2 border-dashed border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-900/50 px-4 py-5 text-center cursor-pointer transition hover:border-cyan-500 hover:bg-cyan-50/60 dark:hover:border-cyan-400 dark:hover:bg-cyan-950/20 focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:ring-offset-2 dark:focus:ring-offset-gray-800">
            <div class="mx-auto mb-2 flex h-10 w-10 items-center justify-center rounded-full bg-cyan-100 dark:bg-cyan-900/40 text-cyan-700 dark:text-cyan-200">
              <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 16V4m0 0l-4 4m4-4l4 4M4 20h16"/></svg>
            </div>
            <div id="changelogFeedbackDropText" class="text-sm font-bold text-gray-800 dark:text-gray-100">Drag and drop file here, or click to browse</div>
            <div class="mt-1 text-xs text-gray-500 dark:text-gray-400">Any file up to 50MB</div>
            <div id="changelogFeedbackSelectedFile" class="hidden mt-3 rounded-lg border border-cyan-200 dark:border-cyan-800 bg-white dark:bg-gray-800 px-3 py-2 text-xs font-semibold text-cyan-800 dark:text-cyan-200 break-words"></div>
          </div>
          <input id="changelogFeedbackAttachment" name="attachment" type="file" class="sr-only">
        </div>
      </form>
      <div class="p-4 border-t border-gray-100 dark:border-gray-700 bg-gray-50 dark:bg-gray-900 sticky bottom-0 flex justify-end gap-2">
        <button type="button" onclick="closeModal('changelogFeedbackModal')" class="px-4 py-2.5 border border-gray-300 dark:border-gray-600 text-gray-700 dark:text-gray-300 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700">Cancel</button>
        <button type="submit" form="changelogFeedbackForm" class="px-5 py-2.5 bg-cyan-700 hover:bg-cyan-800 dark:bg-cyan-500 dark:hover:bg-cyan-400 text-white dark:text-gray-950 rounded-lg font-bold">Submit</button>
      </div>
    </div>
  </div>

  <!-- Calendar Details Modal -->
  <div id="calendarDetailModal" class="fixed inset-0 bg-black/40 hidden z-50 flex items-end sm:items-center justify-center p-4 backdrop-blur-sm transition-all duration-200">
    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl w-full sm:max-w-lg max-h-[85vh] overflow-y-auto overflow-hidden fade-in" onclick="event.stopPropagation()">
      <div class="p-5 border-b border-gray-100 dark:border-gray-700 flex justify-between items-center bg-gray-50 dark:bg-gray-900 sticky top-0 z-10">
        <div>
          <h3 id="calendarDetailTitle" class="text-lg font-bold text-gray-900 dark:text-gray-100">Calendar Details</h3>
          <div class="text-sm text-gray-600 dark:text-gray-400 mt-1">
            <span id="calendarDetailDate"></span> - <span id="calendarDetailType"></span>
            <span id="calendarDetailBadge" class="ml-2 px-3 py-1 rounded-full text-xs font-bold"></span>
          </div>
        </div>
        <button onclick="closeModal('calendarDetailModal')" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 text-2xl leading-none p-2">&times;</button>
      </div>
      <div id="calendarDetailList" class="p-5 space-y-3 bg-white dark:bg-gray-800"></div>
      <div class="p-4 border-t border-gray-100 dark:border-gray-700 bg-gray-50 dark:bg-gray-900 sticky bottom-0">
        <button onclick="closeModal('calendarDetailModal')" class="w-full px-4 py-2.5 bg-gray-800 dark:bg-gray-700 text-white rounded-lg hover:bg-gray-900 dark:hover:bg-gray-600 font-medium">Close</button>
      </div>
    </div>
  </div>

  <div id="requirementStateModal" class="fixed inset-0 bg-black/40 hidden z-50 flex items-end sm:items-center justify-center p-4 backdrop-blur-sm transition-all duration-200">
    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl w-full sm:max-w-md max-h-[90vh] overflow-y-auto overflow-hidden fade-in">
      <div class="p-5 border-b border-gray-100 dark:border-gray-700 flex justify-between items-center bg-gray-50 dark:bg-gray-900 sticky top-0 z-10"><h3 class="text-lg font-bold text-gray-900 dark:text-gray-100">Document Requirement</h3><button onclick="closeModal('requirementStateModal')" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 text-2xl leading-none p-2">&times;</button></div>
      <div class="p-5 space-y-4">
        <p id="requirementStateMessage" class="text-gray-700"></p>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <button id="requirementOptionalBtn" class="px-4 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-medium">Optional</button>
          <button id="requirementNotRequiredBtn" class="px-4 py-3 bg-slate-700 text-white rounded-lg hover:bg-slate-800 font-medium">Not Required</button>
        </div>
        <div class="flex justify-end pt-2 border-t border-gray-100">
          <button onclick="closeModal('requirementStateModal')" class="px-4 py-2.5 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50">Cancel</button>
        </div>
      </div>
    </div>
  </div>
